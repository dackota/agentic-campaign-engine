# The `ace` platform cluster. Image, runtime config, feature gates, and the ate volume
# are copied from the first cluster's k3d config under new names; keep them in step with it.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ace
image: rancher/k3s:v1.37.1-k3s1
servers: 1
agents: 0
# Substrate needs /var/lib/ate on ext4, not the node's overlayfs (see that config).
volumes:
  - volume: ace-ate:/var/lib/ate
    nodeFilters: [server:*]
registries:
  create:
    name: ace-registry
    host: "0.0.0.0"
# Fixed host ports through the k3d load balancer (decisions A21). They must stay clear of
# the browser seam's defaults in apps/web/playwright.config.ts (18080, 15173, 15556).
ports:
  - port: 15180:30180 # web NodePort
    nodeFilters: [loadbalancer]
  - port: 15656:30656 # Dex NodePort
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      - arg: --kube-apiserver-arg=runtime-config=certificates.k8s.io/v1beta1=true
        nodeFilters: [server:*]
      - arg: --kube-apiserver-arg=feature-gates=ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
        nodeFilters: [server:*]
      - arg: --kubelet-arg=feature-gates=ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
        nodeFilters: [server:*]
      - arg: --kube-controller-manager-arg=feature-gates=ClusterTrustBundle=true,PodCertificateRequest=true
        nodeFilters: [server:*]
