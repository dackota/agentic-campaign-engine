apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ace-spike
image: rancher/k3s:v1.37.1-k3s1
servers: 1
agents: 0
# Substrate mounts overlayfs under /var/lib/ate. Inside a k3d node that path is
# itself overlayfs, which the kernel rejects as an upperdir. A Docker volume is
# ext4 on the Docker Desktop VM, so overlay accepts it.
volumes:
  - volume: ace-spike-ate:/var/lib/ate
    nodeFilters: [server:*]
options:
  k3s:
    extraArgs:
      - arg: --kube-apiserver-arg=runtime-config=certificates.k8s.io/v1beta1=true
        nodeFilters: [server:*]
      - arg: --kube-apiserver-arg=feature-gates=ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
        nodeFilters: [server:*]
      - arg: --kubelet-arg=feature-gates=ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
        nodeFilters: [server:*]
      - arg: --kube-controller-manager-arg=feature-gates=ClusterTrustBundle=true,PodCertificateRequest=true
        nodeFilters: [server:*]
