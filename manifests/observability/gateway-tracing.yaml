# agentgateway exports a span per model call to the collector (agentgateway docs, Traces:
# an AgentgatewayPolicy on the Gateway with frontend.tracing). A caller's `traceparent` is
# honoured (client sampling is on by default), so a model call made inside a campaign's trace
# shows in it. The collector is in another namespace, so it needs a ReferenceGrant.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: tracing, namespace: agentgateway-system}
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: Gateway, name: agentgateway-proxy}
  frontend:
    tracing:
      backendRef: {name: otel-collector, namespace: observability, port: 4317}
      protocol: GRPC
      randomSampling: "true"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: allow-gateway-tracing, namespace: observability}
spec:
  from:
  - {group: agentgateway.dev, kind: AgentgatewayPolicy, namespace: agentgateway-system}
  to:
  - {group: "", kind: Service, name: otel-collector}
