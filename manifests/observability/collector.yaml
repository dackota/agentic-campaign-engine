# `make up FULL=1`: one OpenTelemetry collector that every service sends OTLP to, and
# grafana/otel-lgtm (Grafana, Tempo, Loki, Mimir) that stores and shows what it forwards.
# Pods reach the collector at http://otel-collector.observability.svc.cluster.local:4318
# (OTLP/HTTP) or :4317 (gRPC). Grafana is on the lgtm Service, port 3000 (login admin/admin,
# local demo only): kubectl --context k3d-ace -n observability port-forward svc/lgtm 3000:3000
apiVersion: v1
kind: Namespace
metadata: {name: observability}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector, namespace: observability}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      batch: {}
    exporters:
      otlphttp/lgtm:
        endpoint: http://lgtm.observability.svc.cluster.local:4318
        tls: {insecure: true}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/lgtm]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
        args: ["--config=/conf/config.yaml"]
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        volumeMounts:
        - {name: config, mountPath: /conf}
      volumes:
      - name: config
        configMap: {name: otel-collector}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: observability}
spec:
  selector: {app: otel-collector}
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
  - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lgtm, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: lgtm}}
  template:
    metadata: {labels: {app: lgtm}}
    spec:
      containers:
      - name: lgtm
        image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
        ports:
        - {name: grafana, containerPort: 3000}
        - {name: otlp-http, containerPort: 4318}
        readinessProbe:
          httpGet: {path: /api/health, port: grafana}
          periodSeconds: 5
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata: {name: lgtm, namespace: observability}
spec:
  selector: {app: lgtm}
  ports:
  - {name: grafana, port: 3000, targetPort: grafana}
  - {name: otlp-http, port: 4318, targetPort: otlp-http}
