apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: mock-model, namespace: kagent}
spec:
  provider: OpenAI
  model: mock
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://mock-llm.kagent.svc.cluster.local:8000/v1
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata: {name: spike-harness, namespace: kagent}
spec:
  kagent: {}
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:26ae5c772d4a59b24ecb3619c3499e106e3b28abbc239de25b4ff8d746f97e69
  substrate:
    workerPoolRef: {name: kagent-default}
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: {name: spike-template, namespace: kagent}
spec:
  description: Spike agent
  modelConfig: {name: gateway-model}
  systemPrompt: You are a concise, helpful assistant.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: spike-agent, namespace: kagent}
spec:
  templateRef: {name: spike-template}
  harnessRef: {name: spike-harness}
