# Scripted model for the spike: no API key needed. OpenAI-style chat completions on any
# POST path, and Anthropic-style messages on /v1/messages (priority group 2 of the gateway
# until a real Anthropic key exists, docs/decisions/llm-gateway-failover.md).
# Answers "42" to the smoke prompt, recalls an earlier "code word is X", otherwise echoes.
# Usage counts grow with the prompt (about 4 characters a token), so token limits bite.
apiVersion: v1
kind: ConfigMap
metadata: {name: mock-llm, namespace: kagent}
data:
  server.py: |
    import json, os, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import re

    def reply(messages: list[dict]) -> str:
        last, said = "", []
        for m in messages:
            if m.get("role") == "user":
                c = m.get("content")
                last = c if isinstance(c, str) else " ".join(p.get("text", "") for p in c)
                said.append(last)
        if "7 times 6" in last:
            return "42"
        # Context check: "What is the code word?" is answered from an earlier
        # "The code word is X" in the conversation history the harness sends.
        if "what is the code word" in last.lower():
            for earlier in reversed(said[:-1]):
                found = re.search(r"code word is ([\w-]+)", earlier, re.I)
                if found:
                    return "The code word is " + found.group(1)
            return "I do not know the code word"
        return "mock: " + last[:200]

    CHARS_PER_TOKEN = 4

    def tokens(text: str) -> int:
        return max(1, len(text) // CHARS_PER_TOKEN)

    def prompt_text(req: dict) -> str:
        return json.dumps(req.get("messages", [])) + json.dumps(req.get("system", ""))

    def sse(event: str, data: dict) -> bytes:
        return ("event: " + event + "\ndata: " + json.dumps(data) + "\n\n").encode()

    class H(BaseHTTPRequestHandler):
        def log_message(self, f, *a): print(f % a, flush=True)
        def _json(self, code, obj):
            b = json.dumps(obj).encode()
            self.send_response(code); self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            self._json(200, {"object": "list", "data": [{"id": "mock", "object": "model"}]})
        def do_POST(self):
            req = json.loads(self.rfile.read(int(self.headers.get("content-length", 0))) or b"{}")
            text = reply(req.get("messages", []))
            in_tok, out_tok = tokens(prompt_text(req)), tokens(text)
            if self.path.split("?")[0].endswith("/v1/messages"):
                return self._messages(req, text, in_tok, out_tok)
            usage = {"prompt_tokens": in_tok, "completion_tokens": out_tok, "total_tokens": in_tok + out_tok}
            base = {"id": "chatcmpl-mock", "created": int(time.time()), "model": req.get("model", "mock")}
            if req.get("stream"):
                self.send_response(200); self.send_header("content-type", "text/event-stream"); self.end_headers()
                for delta, fin in (({"role": "assistant", "content": text}, None), ({}, "stop")):
                    c = dict(base, object="chat.completion.chunk", choices=[{"index": 0, "delta": delta, "finish_reason": fin}])
                    self.wfile.write(("data: " + json.dumps(c) + "\n\n").encode())
                u = dict(base, object="chat.completion.chunk", choices=[], usage=usage)
                self.wfile.write(("data: " + json.dumps(u) + "\n\ndata: [DONE]\n\n").encode())
                return
            self._json(200, dict(base, object="chat.completion",
                choices=[{"index": 0, "message": {"role": "assistant", "content": text}, "finish_reason": "stop"}],
                usage=usage))
        def _messages(self, req, text, in_tok, out_tok):
            # Anthropic Messages API shape, streamed or not.
            msg = {"id": "msg_mock", "type": "message", "role": "assistant",
                   "model": req.get("model", "mock-anthropic"), "stop_sequence": None}
            if not req.get("stream"):
                return self._json(200, dict(msg, content=[{"type": "text", "text": text}],
                    stop_reason="end_turn", usage={"input_tokens": in_tok, "output_tokens": out_tok}))
            self.send_response(200); self.send_header("content-type", "text/event-stream"); self.end_headers()
            for event, data in (
                ("message_start", {"type": "message_start", "message": dict(msg, content=[], stop_reason=None,
                    usage={"input_tokens": in_tok, "output_tokens": 0})}),
                ("content_block_start", {"type": "content_block_start", "index": 0, "content_block": {"type": "text", "text": ""}}),
                ("content_block_delta", {"type": "content_block_delta", "index": 0, "delta": {"type": "text_delta", "text": text}}),
                ("content_block_stop", {"type": "content_block_stop", "index": 0}),
                ("message_delta", {"type": "message_delta", "delta": {"stop_reason": "end_turn", "stop_sequence": None},
                    "usage": {"output_tokens": out_tok}}),
                ("message_stop", {"type": "message_stop"}),
            ):
                self.wfile.write(sse(event, data))

    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-llm, namespace: kagent}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-llm}}
  template:
    metadata: {labels: {app: mock-llm}}
    spec:
      containers:
      - name: server
        image: python:3.12-alpine
        command: [python, /app/server.py]
        ports: [{containerPort: 8000}]
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: mock-llm}}]
---
apiVersion: v1
kind: Service
metadata: {name: mock-llm, namespace: kagent}
spec:
  selector: {app: mock-llm}
  ports: [{port: 8000, targetPort: 8000}]
