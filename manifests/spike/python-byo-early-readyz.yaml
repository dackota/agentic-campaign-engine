# S0 (#22) variant: same agent, but /readyz answers within a fraction of a second.
# A stdlib thread serves /readyz on 8081 before the heavy imports start, and
# asyncio.start_server is patched to reuse the port so kagent-adk can bind it later.
# Tests whether the wake-up failure is only a slow boot against Substrate's ~5 s probe.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata: {name: s22-pyfast-harness, namespace: kagent}
spec:
  byo: {}
  env:
  - {name: KAGENT_PORT, value: "80"}
  workload:
    image: ghcr.io/kagent-dev/kagent/kagent-adk@sha256:f60b442fc9f729a7441db2b0814105354c118d5b940cc55bce3ac8c9c1f02f28
    command:
    - /.kagent/.venv/bin/python
    - -c
    - |
      import asyncio, socket, threading
      _srv = socket.socket()
      _srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEPORT, 1)
      _srv.bind(("0.0.0.0", 8081))
      _srv.listen(16)
      def _serve():
          while True:
              c, _ = _srv.accept()
              c.recv(1024)
              c.sendall(b"HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nOK")
              c.close()
      threading.Thread(target=_serve, daemon=True).start()
      _start = asyncio.start_server
      asyncio.start_server = lambda *a, **k: _start(*a, reuse_port=True, **k)
      import json, os, uuid
      import uvicorn
      from a2a.types import AgentCard
      from google.adk.agents import BaseAgent
      from google.adk.events import Event
      from google.genai import types
      from google.protobuf.json_format import ParseDict
      from kagent.adk import KAgentApp

      BOOT = uuid.uuid4().hex[:8]
      COUNT = [0]

      class Fixed(BaseAgent):
          async def _run_async_impl(self, ctx):
              COUNT[0] += 1
              text = "42 boot=%s pid=%d n=%d" % (BOOT, os.getpid(), COUNT[0])
              yield Event(author=self.name, content=types.Content(role="model", parts=[types.Part(text=text)]))

      card = ParseDict(json.loads(os.environ["KAGENT_AGENT_CARD_JSON"]), AgentCard())
      app = KAgentApp(
          lambda: Fixed(name="s22_pyfast_agent"),
          card,
          os.environ.get("KAGENT_API_URL", "http://kagent-controller.kagent.svc.cluster.local:8083"),
          "s22-pyfast-agent",
      ).build()
      uvicorn.run(app, host="0.0.0.0", port=8080, log_level="info")
  substrate:
    workerPoolRef: {name: kagent-default}
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: {name: s22-pyfast-template, namespace: kagent}
spec:
  description: Minimal Python BYO agent for the wake-up test
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: s22-pyfast-agent, namespace: kagent}
spec:
  templateRef: {name: s22-pyfast-template}
  harnessRef: {name: s22-pyfast-harness}
