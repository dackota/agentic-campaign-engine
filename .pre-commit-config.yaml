repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -o check-set-e-suppressed
        language: system
        types: [shell]
      - id: eslint
        name: eslint
        entry: sh -c "pnpm install --frozen-lockfile && pnpm --filter web lint"
        language: system
        files: ^apps/web/
        pass_filenames: false
