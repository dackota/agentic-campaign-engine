apiVersion: v1
kind: Namespace
metadata: {name: team-product-marketing}
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: product-marketing-model}
spec:
  provider: OpenAI
  model: glm-5.3-flash
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://agentgateway-proxy.agentgateway-system.svc.cluster.local/product-marketing/v1
