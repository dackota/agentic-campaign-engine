# What every team namespace needs to run Agents, besides the role templates and Agents.
# kagent finds a template's RemoteMCPServer in the template's own namespace, so each team
# gets its own copy of the MCP servers (their URLs are absolute, into the ace namespace).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- runtime.yaml
- ../../mcp.yaml
