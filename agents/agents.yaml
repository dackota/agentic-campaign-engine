# One kagent Agent per AgentTemplate in templates.yaml, all on the Go harness S0 installed
# (spike-harness, golang-adk). The Agent's name is the last part of its A2A URL:
# <controller>/agents/kagent/<name>. Apply after templates.yaml.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: ace-strategist, namespace: kagent}
spec:
  templateRef: {name: ace-strategist}
  harnessRef: {name: spike-harness}
---
apiVersion: api.kagent.dev/v1alpha3
