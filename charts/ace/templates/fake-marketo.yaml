{{- $labels := include "ace.labels" (list . "fake-marketo") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-marketo
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
    spec:
      containers:
        - name: fake-marketo
          {{- include "ace.pythonImage" . | nindent 10 }}
          command:
            {{- include "ace.pythonCommand" (list . "fake_marketo") | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ACE_MARKETO_CLIENT_ID
              value: {{ .Values.marketo.clientId | quote }}
            {{- include "ace.secretEnv" (list . "ACE_MARKETO_CLIENT_SECRET" "marketo-client-secret") | nindent 12 }}
            # The API's webhook route (apps/api/campaign_api/webhook_routes.py).
            - name: ACE_MARKETO_WEBHOOK_URL
              value: {{ printf "http://%s:%v/webhooks/marketo" (include "ace.host" (list . .Values.api.serviceName)) .Values.api.port | quote }}
            {{- include "ace.secretEnv" (list . "ACE_MARKETO_WEBHOOK_SECRET" "marketo-webhook-secret") | nindent 12 }}
            {{- include "ace.otelEnv" (list . "fake-marketo") | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.marketo.serviceName }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selector:
    {{- $labels | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.marketo.port }}
      targetPort: http
