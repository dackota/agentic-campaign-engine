{{- $labels := include "ace.labels" (list . "fake-cms") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-cms
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
    spec:
      containers:
        - name: fake-cms
          {{- include "ace.pythonImage" . | nindent 10 }}
          command:
            {{- include "ace.pythonCommand" (list . "fake_cms") | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          {{- if .Values.otel.endpoint }}
          env:
            {{- include "ace.otelEnv" (list . "fake-cms") | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.cms.serviceName }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selector:
    {{- $labels | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.cms.port }}
      targetPort: http
