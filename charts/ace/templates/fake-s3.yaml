{{- $labels := include "ace.labels" (list . "fake-s3") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-s3
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
    spec:
      containers:
        - name: fake-s3
          {{- include "ace.pythonImage" . | nindent 10 }}
          command:
            {{- include "ace.pythonCommand" (list . "fake_s3") | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.s3.serviceName }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selector:
    {{- $labels | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.s3.port }}
      targetPort: http
