{{- $labels := include "ace.labels" (list . "api") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
    spec:
      initContainers:
        {{- include "ace.waitForDeps" . | nindent 8 }}
      containers:
        - name: api
          {{- include "ace.pythonImage" . | nindent 10 }}
          command:
            {{- include "ace.pythonCommand" (list . "campaign_api") | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "ace.engineEnv" . | nindent 12 }}
            {{- include "ace.otelEnv" (list . "campaign-api") | nindent 12 }}
            - name: ACE_OIDC_ISSUER
              value: {{ .Values.api.oidcIssuer | quote }}
            - name: ACE_OIDC_CLIENT_ID
              value: {{ .Values.api.oidcClientId | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.serviceName }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selector:
    {{- $labels | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
