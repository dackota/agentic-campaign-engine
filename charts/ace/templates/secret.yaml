{{- /*
The app Secret (decisions D1 = A). On first install each value is generated; when `lookup`
finds the Secret (every upgrade, since make up and Tilt both run `helm upgrade --install`),
its values are kept, so the Postgres password always matches the data on the volume.
`helm template` has no cluster, so there it always generates.
*/ -}}
{{- $name := include "ace.secretName" . -}}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if $found }}{{ $data = $found.data | default dict }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ace.labels" (list . "app-secret") | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "postgres-password" "marketo-client-secret" "marketo-webhook-secret" }}
  {{ $key }}: {{ get $data $key | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
