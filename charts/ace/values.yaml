# The release is named `ace` in namespace `ace`, by `make up` and by the Tiltfile alike.
web:
  image:
    # Ours: built from apps/web/Dockerfile and pushed to the cluster's local registry.
    repository: ace-web
    tag: dev
    pullPolicy: IfNotPresent
  # Fixed host port 15180 maps to this node port in platform/ace-cluster.yaml.
  nodePort: 30180
  # nginx looks the API up at request time, so the web pod starts before the API exists.
  dnsResolver: kube-dns.kube-system.svc.cluster.local

api:
  serviceName: api
  port: 8000
  # The issuer the API trusts: the constant in platform/oidc-issuer.txt (decisions A20). Helm
  # reads no file outside the chart, so it is repeated here; tests/tooling/
  # test_platform_install.py checks the two match. Dex itself is installed by `make up`.
  oidcIssuer: http://dex.ace.localhost:15656/dex
  oidcClientId: ace-web

# Where the services send OTLP traces. `make up FULL=1` sets it to the collector; empty
# exports nothing.
otel:
  endpoint: ""

# live: the worker calls the real kagent Agents under worker.agentUrl (one per role, by name).
# The run modes are in SPEC.md.
depth: live

# One image for the API, the worker, and the fake Marketo (apps/python.Dockerfile).
python:
  image:
    repository: ace-python
    tag: dev
    pullPolicy: IfNotPresent
  # make dev sets this: a file watcher restarts each Python process when Tilt syncs a save.
  reload: false

worker:
  # The kagent controller serves each Agent at <this>/<agent name> (wired by #29).
  agentUrl: http://kagent-controller.kagent.svc.cluster.local:8083/agents/kagent
  # How long the worker waits for one agent reply. A live model, slowed by the team's token
  # limit at the gateway, can take minutes; the live test stack waits as long.
  agentTimeoutSeconds: 180
  # The kagent controller itself: the worker's `kagent sandbox` CLI runs the design agent's
  # program through it (docs/decisions/sandbox-design-agent.md).
  kagentApiUrl: http://kagent-controller.kagent.svc.cluster.local:8083

marketo:
  serviceName: fake-marketo
  port: 8000
  # Not a secret: Marketo's OAuth2 client id. Its secret is in the app Secret.
  clientId: ace-demo

# The Workfront-shaped fake and the MCP servers that read it (and the other fakes).
workfront:
  serviceName: fake-workfront
  port: 8000
  clientId: ace-demo

# One read-only MCP server per fake, registered in kagent by agents/mcp.yaml.
mcp:
  port: 8000

# The learnings store (docs/decisions/learnings-store.md). Each team gets its own learnings
# search server. Embeddings come from the gateway's OpenAI-shaped route when both are set;
# blank uses the fixed stand-in. OpenCode Go lists no embedding model (docs/sources.md), so
# both stay blank until the gateway has an embedding backend.
learnings:
  teams: [demand-gen, product-marketing]
  embeddingUrl: ""
  embeddingModel: ""

# The CMS and the S3 store are fakes (docs/decisions/cms-and-asset-store.md).
cms:
  serviceName: fake-cms
  port: 8000

s3:
  serviceName: fake-s3
  port: 8000
  bucket: ace-assets

postgres:
  # Third-party images are pinned by digest (docs/pinned-versions.md).
  # Postgres 16 with the pgvector extension, for the learnings store's embeddings.
  image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
  serviceName: postgres
  port: 5432
  user: ace
  database: ace
  storage: 1Gi

temporal:
  # The Temporal CLI's dev server, with its SQLite file on a volume.
  image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
  serviceName: temporal
  port: 7233
  namespace: default
  storage: 1Gi
