[project]
name = "agentic-campaign-engine"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mjml-python>=1.4.2",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2",
    "temporalio>=1.34.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pre-commit>=3",
    "testcontainers>=4.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["tests", "apps/engine", "apps/api", "apps/worker", "services/fakes", "services/render"]
mypy_path = ["apps/engine", "apps/api", "apps/worker", "services/fakes", "services/render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/engine", "apps/api", "apps/worker", "services/fakes", "services/render"]
